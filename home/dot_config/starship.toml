palette = "noctalia"
command_timeout = 1000
format = """\
  $cmd_duration\
  $sudo\
  $hostname\
  $directory\
  $git_branch\
  $git_state\
  $git_status\
  $jj_status\
  $jj_change\
  $jj_bookmark\
  $python\
  $rust\
  $nodejs\
  $container\
  ${env_var.ZMX_SESSION}\
  $line_break\
  $character\
"""

[directory]
style = "bold sapphire"

[git_branch]
ignore_branches = ["HEAD"]
style = 'bold subtext0'

[git_state]
style = 'bold subtext0'

[git_status]
style = 'bold subtext0'

[jj_status]
style = 'bold subtext1'

[jj_change]
format = "[$change_prefix]($prefix_style) "

[jj_bookmark]
style = 'bold subtext1'

[python]
style = "green"

[env_var.ZMX_SESSION]
symbol = " "
format = "[$symbol$env_value]($style) "
description = "zmx session name"
style = "bold magenta"

[nodejs]
version_format = "v${major}.${minor}"
format = "[$symbol($version )]($style)"

