# Bind-mounted into the mopidy container to decouple it from the host's
# tailscale-managed resolv.conf (single resolver = single point of failure).
# Tailscale MagicDNS first (for *.ts.net / nas), public fallbacks after so a
# tailscale hiccup does not break Tidal/Last.fm/etc. resolution.
nameserver 100.100.100.100
nameserver 1.1.1.1
nameserver 8.8.8.8
options timeout:2 attempts:2
