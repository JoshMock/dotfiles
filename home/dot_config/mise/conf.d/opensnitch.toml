# OpenSnitch firewall rules and domain/ip/nets lists
# Run files/opensnitch/migrate-lists.sh once (with sudo) on a new machine
# to convert legacy flat domain files to the subdirectory/list structure.

[bootstrap.packages]
"pacman:opensnitch" = "latest"

# ── Directories ─────────────────────────────────────────────────────────────

[bootstrap.directories."/etc/opensnitchd/rules"]
owner = "root"
group = "root"
mode = "0755"

