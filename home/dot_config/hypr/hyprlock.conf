general {
  hide_cursor = true
}

background {
  monitor =
  # blur the live desktop instead of a static wallpaper
  path = screenshot
  color = rgba(18, 18, 22, 1.0)
  blur_passes = 3
  blur_size = 6
  noise = 0.02
  contrast = 0.9
  # darken the blur so light text reads over any wallpaper
  brightness = 0.6
  vibrancy = 0.2
  vibrancy_darkness = 0.4
}

label {
  monitor =
  # $TIME is a hyprlock built-in, but only a cmd[update:...] label re-renders
  # on a timer (plain text labels refresh hourly), so the echo keeps it ticking
  text = cmd[update:1000] echo "$TIME"
  color = rgba(245, 246, 248, 0.95)
  font_family = FiraCode Nerd Font Mono
  font_size = 96
  position = 0, -110
  halign = center
  valign = center
  shadow_passes = 3
  shadow_size = 24
  shadow_color = rgba(0, 0, 0, 0.55)
  shadow_boost = 1.4
}

label {
  monitor =
  # weekday + date, refreshed once a minute (markup keeps it small and dim)
  text = cmd[update:60000] date '+%A, %B %-d'
  color = rgba(214, 216, 224, 0.75)
  font_family = FiraCode Nerd Font Mono
  font_size = 18
  position = 0, -40
  halign = center
  valign = center
  shadow_passes = 2
  shadow_size = 8
  shadow_color = rgba(0, 0, 0, 0.5)
}

input-field {
  monitor =
  size = 250, 40
  outline_thickness = 2
  dots_size = 0.24
  dots_spacing = 0.15
  dots_center = false
  rounding = 6
  outer_color = rgba(255, 255, 255, 0.15)
  inner_color = rgba(28, 28, 33, 0.85)
  font_color = rgba(235, 236, 240, 1.0)
  check_color = rgba(130, 180, 255, 0.9)
  fail_color = rgba(255, 110, 110, 0.9)
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  fade_on_empty = true
  placeholder_text = <i>Input Password...</i>
  hide_input = false
  position = 0, 60
  halign = center
  valign = center
}
